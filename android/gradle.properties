# Project-wide Gradle settings.
# The GitHub runner has ~7 GB. Gradle, the Kotlin compile daemon and KSP are
# three separate JVMs, and the Kotlin daemon was being killed on startup with
# no explicit heap of its own, so each gets a budget that fits.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is mandatory for this project.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Room / KSP
ksp.incremental=true
android.defaults.buildfeatures.buildconfig=false
