<!DOCTYPE html>
<html><head><style>
body { font-family: Georgia, serif; margin: 0; padding: 0; }
.cert { padding: 60px; text-align: center; }
.header { color: #1a4a8a; font-size: 24pt; font-weight: bold; }
.body { font-size: 12pt; margin: 40px 0; line-height: 1.6; text-align: justify; }
</style></head><body>
<div class="cert">
  <div class="header">{{MAHALLU_NAME}}</div>
  <h2>DEATH CERTIFICATE</h2>
  <div class="body">
    <p>Cert No: <b>{{CERT_NO}}</b> &nbsp; Date: <b>{{DATE}}</b></p>
    <p>This is to certify that <b>{{DECEASED_NAME}}</b> (S/o/D/o {{FATHER_NAME}})
       passed away on <b>{{DATE_OF_DEATH}}</b> and was buried on {{BURIAL_DATE}}
       at {{BURIAL_PLACE}}.</p>
    <p>Cause of death: {{CAUSE_OF_DEATH}}</p>
  </div>
</div>
</body></html>
