<!DOCTYPE html>
<html><head><style>
body { font-family: Georgia, serif; margin: 0; padding: 0; }
.cert { padding: 60px; text-align: center; }
.header { color: #1a4a8a; font-size: 24pt; font-weight: bold; }
.body { font-size: 12pt; margin: 40px 0; line-height: 1.6; text-align: justify; }
</style></head><body>
<div class="cert">
  <div class="header">{{MAHALLU_NAME}}</div>
  <h2>MARRIAGE CERTIFICATE</h2>
  <div class="body">
    <p>Cert No: <b>{{CERT_NO}}</b> &nbsp; Date: <b>{{DATE}}</b></p>
    <p>This is to certify that the marriage of <b>{{GROOM_NAME}}</b> (S/o {{GROOM_FATHER}})
       and <b>{{BRIDE_NAME}}</b> (D/o {{BRIDE_FATHER}}) was solemnized on
       <b>{{NIKAH_DATE}}</b> at {{PLACE}} in the presence of witnesses.</p>
    <p>Mahar: {{MAHAR}}</p>
  </div>
</div>
</body></html>
