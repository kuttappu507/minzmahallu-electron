name: Run Integrity Fixes
on:
  push:
    paths:
      - 'README.md'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply fixes
        run: python scripts/apply_integrity_fixes.py
      - name: Verify
        run: |
          grep -q 'tokens:removeEvent' electron/preload.mts
          grep -q 'tokens:removeEvent' electron/main.ts
          grep -q 'Medical Aid' src/pages/Welfare.tsx
          grep -q 'preferCSSPageSize: true' electron/main.ts
          grep -q 'cert_marriage' electron/print/certificate.template.ts
          test -s resources/sql/migrations/V011_fix_module_schema_compatibility.sql
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'fix: repair module wiring reports welfare and demo data' || exit 0
          git push
