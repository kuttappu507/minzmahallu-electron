name: Build Android APK

# Builds the Kotlin/Compose port in android/ and publishes the APK.
#
# Two artifacts, because they answer different questions:
#   * debug   — always built, auto-signed with the runner's debug key. This is
#               the one to sideload on a phone and try.
#   * release — built only when the signing secrets exist. It is minified and
#               resource-shrunk, so it is also the build that exercises R8,
#               which the debug build never does.
#
# There is no JDK in the development sandbox this project was written in, so
# this workflow is the first real compiler the code has met. Treat a red run
# as information, not as a broken pipeline.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build the signed release APK (needs signing secrets)"
        type: boolean
        default: false

permissions:
  contents: write

# A push that supersedes a still-running build should cancel it — these runs
# are long and there is no value in finishing a build nobody will look at.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every Gradle invocation runs from the Android project root, not the repo
  # root: android/ is its own Gradle build with its own settings file.
  ANDROID_ROOT: android

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # AGP 8.5 requires JDK 17; the build targets Java 17 bytecode.
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Cache the downloaded distribution and the resolved dependency graph.
          # A cold Android build resolves several hundred megabytes; this turns
          # the second run from ~10 minutes into ~3.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x "$ANDROID_ROOT/gradlew"

      - name: Show resolved toolchain
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          java -version
          ./gradlew --version

      # ---------------------------------------------------------------------
      # Unit tests first: they are JVM-only, so they compile :core:common and
      # :core:domain and catch logic regressions without waiting for the whole
      # APK. SubscriptionAllocation in particular is real money arithmetic.
      # ---------------------------------------------------------------------
      - name: Unit tests
        working-directory: ${{ env.ANDROID_ROOT }}
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android/**/build/reports/tests/
          if-no-files-found: ignore

      # ---------------------------------------------------------------------
      # Debug APK. Signed with the runner's debug keystore, so it installs on a
      # real device with no secret management at all.
      # ---------------------------------------------------------------------
      - name: Assemble debug APK
        working-directory: ${{ env.ANDROID_ROOT }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename debug APK
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No debug APK was produced"
            exit 1
          fi
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          short_sha=$(echo "${{ github.sha }}" | cut -c1-7)
          cp "$apk" "dist/MinzMahallu-${version:-dev}-${short_sha}-debug.apk"
          ls -lh dist/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MinzMahallu-debug
          path: android/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------------
      # Release APK. Needs a keystore; the build reads it from the environment
      # (see android/app/build.gradle.kts) so no key is ever committed.
      # If the secrets are absent the step is skipped rather than failing the
      # run — an unsigned release APK is not installable and not worth keeping.
      # ---------------------------------------------------------------------
      - name: Import signing keystore
        id: keystore
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_release) || startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set; skipping the signed release build."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > /tmp/minzmahallu.keystore
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "Keystore written ($(wc -c < /tmp/minzmahallu.keystore) bytes)"

      - name: Assemble release APK
        if: steps.keystore.outputs.present == 'true'
        working-directory: ${{ env.ANDROID_ROOT }}
        env:
          MMS_KEYSTORE: /tmp/minzmahallu.keystore
          MMS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MMS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MMS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename release APK
        if: steps.keystore.outputs.present == 'true'
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No release APK was produced"
            exit 1
          fi
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          cp "$apk" "dist/MinzMahallu-${version:-dev}-release.apk"
          ls -lh dist/

      - name: Upload release APK
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MinzMahallu-release
          path: android/dist/*-release.apk
          if-no-files-found: error
          retention-days: 90

      # Keep the mapping file: without it, a crash report from the minified
      # release build is unreadable.
      - name: Upload R8 mapping
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

      # ---------------------------------------------------------------------
      # A version tag publishes the APK on the release itself, so the office
      # can download it without touching Actions.
      # ---------------------------------------------------------------------
      - name: Publish APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" dist/*.apk \
            --title "Minz Mahallu $tag (Android)" \
            --notes "Android APK built from ${{ github.sha }}." \
            --target "$GITHUB_SHA" \
            2>/dev/null || gh release upload "$tag" dist/*.apk --clobber
