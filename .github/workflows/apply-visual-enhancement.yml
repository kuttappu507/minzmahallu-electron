name: Apply Visual Enhancement
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to enhance
        required: true
        default: visual-enhancement-work
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - name: Apply changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          # Remove Gayathri everywhere from the tracked source/assets.
          for p in list(Path('.').rglob('*')):
              if p.is_file() and ('.git' not in p.parts) and ('Gayathri' in p.name or 'gayathri' in p.name):
                  p.unlink()
          for p in [Path('src/styles/globals.css'), Path('src/styles/overrides.css'), Path('src/main.tsx')]:
              if p.exists():
                  s=p.read_text(encoding='utf-8')
                  s=re.sub(r'(?i)Gayathri', 'Anek Malayalam Variable', s)
                  p.write_text(s,encoding='utf-8')
          
          # Remove old Gayathri @font-face blocks safely.
          css=Path('src/styles/globals.css')
          if css.exists():
              s=css.read_text(encoding='utf-8')
              s=re.sub(r'@font-face\s*\{[^}]*font-family\s*:\s*["\']?Anek Malayalam Variable["\']?[^}]*\}\s*', '', s, flags=re.I)
              css.write_text(s,encoding='utf-8')
          
          # Add the visual system to overrides without touching component logic.
          ov=Path('src/styles/overrides.css')
          s=ov.read_text(encoding='utf-8') if ov.exists() else ''
          marker='/* ===== FINAL VISUAL SYSTEM ===== */'
          if marker not in s:
              s += '''\n\n/* ===== FINAL VISUAL SYSTEM ===== */\n:root {\n  --ui-radius: 12px;\n  --ui-radius-sm: 9px;\n}\n\n/* Tables: readable type, consistent header/body geometry and column spacing. */\n.data-table table { width: 100%; border-collapse: separate; border-spacing: 0; }\n.data-table th, .data-table td { vertical-align: middle; text-align: left; }\n.data-table th { font-size: 12.5px !important; font-weight: 650 !important; line-height: 1.35; white-space: nowrap; padding: 13px 16px !important; }\n.data-table td { font-size: 14px !important; line-height: 1.45; padding: 14px 16px !important; }\n.data-table th:first-child, .data-table td:first-child { padding-left: 18px !important; }\n.data-table th:last-child, .data-table td:last-child { padding-right: 18px !important; }\n.data-table tbody tr { min-height: 48px; }\n.data-table .act-col, .data-table th:last-child { text-align: right; }\n\n/* Dashboard statistics. */\n.stat-grid .sval, .stat-grid .stat-value, .stat-grid .val { font-size: 34px !important; line-height: 1.05; font-weight: 700 !important; letter-spacing: -0.02em; }\n.stat-grid .slab, .stat-grid .stat-label, .stat-grid .label { font-size: 12px !important; line-height: 1.4; font-weight: 600 !important; }\n.stat-grid .sdelta, .stat-grid .stat-delta, .stat-grid .delta { font-size: 11.5px !important; }\n\n/* Forms. */\ninput:not([type="checkbox"]):not([type="radio"]), textarea, select { font-size: 15px !important; line-height: 1.45; }\nlabel, .label, .field-label { font-size: 12.5px !important; font-weight: 600 !important; }\nbutton { font-size: 13.5px; }\n\n/* Malayalam readability. */\nhtml.lang-ml *, html.lang-ml body, html.lang-ml input, html.lang-ml button, html.lang-ml select, html.lang-ml textarea {\n  font-family: "Anek Malayalam Variable", Poppins, sans-serif !important;\n}\nhtml.lang-ml .data-table th, html.lang-ml thead th { font-size: 13px !important; font-weight: 650 !important; line-height: 1.4; }\nhtml.lang-ml .data-table td { font-size: 14.5px !important; line-height: 1.55; }\nhtml.lang-ml input, html.lang-ml textarea, html.lang-ml select { font-size: 15.5px !important; line-height: 1.55; }\n'''
              ov.write_text(s,encoding='utf-8')
          
          # Replace the print document builders as a complete unit.
          main=Path('electron/main.ts')
          if main.exists():
              s=main.read_text(encoding='utf-8')
              start=s.find('// ===== Token sheet HTML builder')
              end=s.find('// ===== IPC:', start)
              if start >= 0 and end >= 0:
                  block=r'''// ===== Print document builders =====
function printCss(extra = ""): string {
  return `@page { size: A4 portrait; margin: 0; } * { box-sizing: border-box; } html,body { margin:0; padding:0; width:210mm; background:#fff; } body { font-family:Poppins,"Segoe UI",Arial,sans-serif; color:#17231d; -webkit-print-color-adjust:exact; print-color-adjust:exact; } ${extra}`;
}

function buildTokenSheetHtml(tokenList: any[], event: any): string {
  const eventName=event?.event_name||"Event", eventDate=event?.event_date||"", eventTime=event?.event_time||"", venue=event?.venue||"";
  const cards=tokenList.map((t:any)=>`<article class="ticket"><div class="stripe"></div><header><div class="mark">M</div><div><b>MINZ MAHALLU</b><small>Mahallu Management System</small></div><span class="tag">EVENT TOKEN</span></header><div class="event">${esc(eventName)}</div><div class="meta">${esc(eventDate)}${eventTime?` · ${esc(eventTime)}`:""}${venue?` · ${esc(venue)}`:""}</div><div class="token">${esc(t.token_code)}</div><div class="details"><div><span>Family</span><b>${esc(t.house_name||t.family_number||"—")}</b></div><div><span>House No.</span><b>${esc(t.house_number||t.family_number||"—")}</b></div><div><span>Ward</span><b>${esc(t.ward||"—")}</b></div></div><footer><span>Present this token at the event</span><b>VALID</b></footer></article>`).join("");
  return `<!doctype html><html><head><meta charset="utf-8"><style>${printCss(`.sheet{padding:9mm;display:grid;grid-template-columns:1fr 1fr;gap:4mm}.ticket{height:43mm;border:.4mm solid #c7ddd3;border-radius:3mm;padding:4mm 4.5mm 3mm;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#fff}.stripe{position:absolute;left:0;top:0;bottom:0;width:2mm;background:#0eab7f}.ticket header{display:flex;align-items:center;gap:2.5mm}.mark{width:7mm;height:7mm;border-radius:2mm;background:#0eab7f;color:#fff;display:grid;place-items:center;font-size:4mm;font-weight:800}.ticket header b{font-size:2.5mm;letter-spacing:.08em;display:block}.ticket header small{font-size:1.6mm;color:#718178;display:block}.tag{margin-left:auto;font-size:1.6mm;color:#0b916c;font-weight:700;letter-spacing:.12em}.event{font-size:3.1mm;font-weight:650;margin-top:2.2mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:1.8mm;color:#718178;margin-top:.5mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.token{font:800 8.5mm/1 "Courier New",monospace;letter-spacing:.1em;text-align:center;margin:2.4mm 0 1.7mm;color:#17231d}.details{border-top:.25mm solid #e1ebe5;padding-top:1.7mm;display:grid;grid-template-columns:1.5fr 1fr .7fr;gap:3mm}.details span{display:block;font-size:1.6mm;color:#819189}.details b{display:block;font-size:2.2mm;margin-top:.4mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ticket footer{margin-top:auto;padding-top:1.5mm;border-top:.2mm solid #edf3ef;display:flex;justify-content:space-between;font-size:1.55mm;color:#819189}.ticket footer b{color:#0b916c;letter-spacing:.08em}`)}</style></head><body><main class="sheet">${cards}</main></body></html>`;
}

function buildCollectionSheetHtml(tokenList:any[],event:any):string{
  const rows=tokenList.map((t:any,i:number)=>`<tr><td>${i+1}</td><td class="code">${esc(t.token_code)}</td><td>${esc(t.house_name||t.family_number||"—")}</td><td>${esc(t.house_number||t.family_number||"—")}</td><td>${esc(t.ward||"—")}</td><td class="box">□</td><td></td></tr>`).join("");
  return `<!doctype html><html><head><meta charset="utf-8"><style>${printCss(`.page{padding:13mm}.head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:.4mm solid #cfe2d8;padding-bottom:5mm;margin-bottom:6mm}.brand{display:flex;gap:3mm;align-items:center}.mark{width:10mm;height:10mm;border-radius:3mm;background:#0eab7f;color:#fff;display:grid;place-items:center;font-weight:800;font-size:5mm}.head h1{margin:0;font-size:6mm}.sub{font-size:2.3mm;color:#718178;margin-top:1mm}.event{text-align:right}.event b{display:block;color:#0b916c;font-size:3mm}.event span{font-size:2.2mm;color:#718178}table{width:100%;border-collapse:collapse;border:.3mm solid #d7e5dd}th{background:#f2f7f4;color:#51635a;font-size:2.2mm;font-weight:700;padding:3mm 2.5mm;text-align:left;border-bottom:.3mm solid #d7e5dd}td{font-size:2.8mm;padding:2.8mm 2.5mm;border-bottom:.25mm solid #e4ece7}tr:last-child td{border-bottom:0}.code{font:700 3.1mm "Courier New",monospace;color:#0b916c}.box{text-align:center;font-size:4mm;width:15mm}td:first-child{text-align:center;width:10mm;color:#819189}td:last-child{width:35mm}.foot{margin-top:5mm;display:flex;justify-content:space-between;color:#819189;font-size:2mm}`)}</style></head><body><section class="page"><header class="head"><div class="brand"><div class="mark">M</div><div><h1>Token Collection Sheet</h1><div class="sub">Minz Mahallu · Mahallu Management System</div></div></div><div class="event"><b>${esc(event?.event_name||"Event")}</b><span>${esc(event?.event_date||"")}</span></div></header><table><thead><tr><th>No.</th><th>Token</th><th>Family</th><th>House No.</th><th>Ward</th><th>Collected</th><th>Signature</th></tr></thead><tbody>${rows}</tbody></table><div class="foot"><span>Verify each returned token before marking collected.</span><span>Total: ${tokenList.length}</span></div></section></body></html>`;
}

function buildCertificateHtml(cert:any):string{
  const type=String(cert?.type||"certificate").toLowerCase();
  const titles:any={membership:"MEMBERSHIP CERTIFICATE",residence:"RESIDENCE CERTIFICATE",marriage:"MARRIAGE CERTIFICATE",death:"DEATH CERTIFICATE"};
  const title=titles[type]||`${esc(cert?.type||"CERTIFICATE").toUpperCase()} CERTIFICATE`;
  const issued=cert?.issued_date?new Date(cert.issued_date).toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"}):"";
  const number=cert?.certificate_number||cert?.certificateNo||"—";
  const name=cert?.issued_to||cert?.member_name||cert?.name||"—";
  return `<!doctype html><html><head><meta charset="utf-8"><style>${printCss(`.certificate{width:210mm;height:297mm;padding:15mm;position:relative}.frame{position:absolute;inset:9mm;border:.5mm solid #b8d8ca}.inner{position:absolute;inset:12mm;border:.2mm solid #dceae3}.top{position:relative;z-index:1;display:flex;justify-content:space-between;padding:5mm 5mm 0}.brand{display:flex;align-items:center;gap:3mm}.mark{width:14mm;height:14mm;border-radius:4mm;background:#0eab7f;color:#fff;display:grid;place-items:center;font-size:7mm;font-weight:800}.brand b{display:block;font-size:4.2mm;letter-spacing:.06em}.brand small{display:block;font-size:2.2mm;color:#718178;margin-top:1mm}.meta{text-align:right;font-size:2.2mm;color:#718178;line-height:1.7}.meta b{color:#17231d}.hero{position:relative;z-index:1;text-align:center;margin-top:25mm}.eyebrow{font-size:2.2mm;letter-spacing:.24em;color:#0b916c;font-weight:700}.title{font-size:9mm;font-weight:700;letter-spacing:.05em;margin-top:3mm}.rule{width:45mm;height:.6mm;background:#0eab7f;margin:5mm auto}.intro{font-size:3.4mm;color:#718178;margin-top:12mm}.name{font-size:9mm;font-weight:700;color:#17231d;margin:5mm auto 3mm;max-width:170mm}.body{width:145mm;margin:0 auto;font-size:3.5mm;line-height:1.8;color:#3f5148}.info{position:relative;z-index:1;margin:20mm 15mm 0;border-top:.3mm solid #dceae3;border-bottom:.3mm solid #dceae3;padding:5mm 0;display:grid;grid-template-columns:1fr 1fr;gap:4mm}.info div{display:flex;justify-content:space-between;gap:4mm;font-size:2.7mm}.info span{color:#819189}.info b{font-weight:650}.bottom{position:absolute;z-index:1;left:20mm;right:20mm;bottom:22mm;display:flex;justify-content:space-between;align-items:flex-end}.sig{width:45mm;text-align:center;border-top:.25mm solid #718178;padding-top:2mm;font-size:2.3mm;color:#51635a}.seal{width:25mm;height:25mm;border:.5mm dashed #9cbcaf;border-radius:50%;display:grid;place-items:center;color:#0b916c;font-size:1.8mm;font-weight:700;text-align:center}`)}</style></head><body><main class="certificate"><div class="frame"></div><div class="inner"></div><header class="top"><div class="brand"><div class="mark">M</div><div><b>MINZ MAHALLU</b><small>Mahallu Management System</small></div></div><div class="meta">Certificate No.<br><b>${esc(number)}</b><br>${esc(issued)}</div></header><section class="hero"><div class="eyebrow">OFFICIAL DOCUMENT</div><div class="title">${title}</div><div class="rule"></div><div class="intro">This is to certify that</div><div class="name">${esc(name)}</div><div class="body">is a registered member/resident of Minz Mahallu. This certificate is issued by the Mahallu Management Committee for official purposes.</div></section><section class="info"><div><span>Certificate Type</span><b>${esc(cert?.type||"Certificate")}</b></div><div><span>Issued Date</span><b>${esc(issued)}</b></div></section><footer class="bottom"><div class="sig">Secretary</div><div class="seal">OFFICIAL<br>SEAL</div><div class="sig">President</div></footer></main></body></html>`;
}

'''
                  s=s[:start]+block+s[end:]
                  main.write_text(s,encoding='utf-8')
          PY
      - name: Remove workflow helper and commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          rm -f .github/workflows/visual-enhancement.yml
          git add -A
          git commit -m "feat: visual enhancement and redesign print documents" || exit 0
          git push origin HEAD:${{ inputs.branch }}
