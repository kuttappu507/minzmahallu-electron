name: Fix UI and tokens
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, '[fix-ui-tokens]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI and token workflow
        shell: python
        run: |
          from pathlib import Path
          import re
          def r(p): return Path(p).read_text()
          def w(p,s): Path(p).write_text(s)
          w('public/logo.svg','''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none"><defs><linearGradient id="g" x1="8" y1="8" x2="56" y2="56"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs><rect x="4" y="4" width="56" height="56" rx="16" fill="url(#g)"/><path d="M18 48V29.5L32 18l14 11.5V48M25 48V35h14v13M29 29h6M32 18v-5M28.5 13h7M14 48h36" stroke="white" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/></svg>''')
          p='src/components/layout/Sidebar.tsx'; s=r(p); s=s.replace('<span className="logo"><b>M</b></span>','<span className="logo"><img src="/logo.svg" alt="MMS" /></span>'); w(p,s)
          p='src/pages/LoginPage.tsx'; s=r(p).replace('<div className="login-logo-box"><b>M</b></div>','<div className="login-logo-box"><img src="/logo.svg" alt="MMS" /></div>').replace('<div className="login-logo-box-sm"><b>M</b></div>','<div className="login-logo-box-sm"><img src="/logo.svg" alt="MMS" /></div>'); w(p,s)
          p='src/styles/topbar-fixes.css'; s=r(p)+'''\n.langseg{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:3px;gap:2px;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-sizing:border-box;vertical-align:middle}.langseg button{height:26px;min-width:36px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:transparent;color:var(--mut);font:700 11px/1 Poppins,"Noto Sans Malayalam",sans-serif;white-space:nowrap;cursor:pointer;box-sizing:border-box}.langseg button:last-child{min-width:44px;font-size:11px}.langseg button.on{background:var(--em);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12)}\n'''; w(p,s)
          p='src/App.tsx'; s=r(p)
          if '"@/styles/topbar-fixes.css"' not in s:s=s.replace('import "@/styles/global-search.css";','import "@/styles/global-search.css";\nimport "@/styles/topbar-fixes.css";')
          if 'import { TokenEvents }' not in s:s=s.replace('import { TokensWithPrint } from "@/pages/TokensWithPrint";','import { TokensWithPrint } from "@/pages/TokensWithPrint";\nimport { TokenEvents } from "@/pages/TokenEvents";')
          s=s.replace('<Route path="/tokens" element={<TokensWithPrint />} />','<Route path="/tokens" element={<TokenEvents />} />\n            <Route path="/tokens/manage" element={<TokensWithPrint />} />'); w(p,s)
          # Token colours: remove event-type mapping and use token sequence index.
          for p in ['electron/print/token.template.ts','src/lib/tokenPrint.ts']:
            s=r(p); s=re.sub(r'function paletteForEvent\(event: any\) \{.*?\n\}\n','function paletteForTokenIndex(index: number) { return palettes[Math.abs(index) % palettes.length]; }\n',s,flags=re.S)
            if p.endswith('token.template.ts'):
              s=s.replace('const p = paletteForEvent(event);','const p = paletteForTokenIndex(0);')
            else:
              s=s.replace('const base = paletteForEvent(event);','const base = paletteForTokenIndex(0);')
            s=s.replace('const makeCard = (t: any) => `','const makeCard = (t: any, cardIndex: number) => { const p = paletteForTokenIndex(cardIndex); return `')
            s=s.replace('    </article>`;','    </article>`; };',1)
            s=s.replace('.map(makeCard).join(\'\')','.map((t, idx) => makeCard(t, i + idx)).join(\'\')').replace('.map(makeCard).join("")','.map((t, idx) => makeCard(t, i + idx)).join("")')
            w(p,s)
          # Route existing manager to a subpage event and read its query parameter.
          p='src/pages/Tokens.tsx'; s=r(p)
          s=s.replace('if (result?.length && !selectedEventId) setSelectedEventId(result[0].id);','const requestedEventId = Number(new URLSearchParams(window.location.search).get("event") || 0); const requested = result?.find((e:any) => e.id === requestedEventId); if (requested) setSelectedEventId(requested.id); else if (result?.length && !selectedEventId) setSelectedEventId(result[0].id);')
          w(p,s)
          # Move colour/B&W control into the same toolbar instead of floating above the page.
          p='src/pages/TokensWithPrint.tsx'; s=r(p)
          old=re.search(r'\n\s*<div className="token-print-mode".*?</div>\n\s*<Tokens />',s,re.S)
          if old:
            control='''<Tokens />'''
            s=s[:old.start()]+'\n      <Tokens />'+s[old.end():]
          # Keep control visible in the toolbar by injecting it immediately after Collection Sheet buttons via CSS/DOM is avoided; use a compact fixed toolbar control near the shell header.
          s=s.replace('<Tokens />','<div className="token-print-toolbar"><span>{ml ? "പ്രിന്റ്" : "Print"}</span><button type="button" className={mode === "color" ? "on" : ""} onClick={() => setMode("color")} disabled={printing}>{ml ? "നിറം" : "Color"}</button><button type="button" className={mode === "bw" ? "on" : ""} onClick={() => setMode("bw")} disabled={printing}>{ml ? "കറുപ്പ് & വെളുപ്പ്" : "B&W"}</button></div><Tokens />')
          s=re.sub(r'<style>\{`.*?`\}</style>', '<style>{`.token-print-toolbar{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin:0 0 8px auto;width:max-content;padding:3px;border:1px solid var(--line);background:var(--panel);border-radius:9px;box-shadow:var(--sh);font:500 11px Poppins;color:var(--mut)}.token-print-toolbar span{padding:0 5px;color:var(--fnt)}.token-print-toolbar button{border:0;background:transparent;color:var(--mut);border-radius:7px;padding:5px 8px;cursor:pointer;font:700 11px/1 Poppins}.token-print-toolbar button.on{background:var(--em);color:#fff}`}</style>',s,flags=re.S)
          w(p,s)
          Path('.github/workflows/fix-ui-tokens.yml').unlink()
      - name: Build
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || (git commit -m "fix UI and token workflow [fix-ui-tokens]" && git push)
