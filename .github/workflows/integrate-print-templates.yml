name: Integrate print templates
on:
  push:
    branches: [print-template-enhancement]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: print-template-enhancement
          fetch-depth: 0
      - name: Replace inline print builders with templates
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('electron/main.ts')
          s=p.read_text(encoding='utf-8')
          imports='''import { buildTokenSheetHtml } from "./print/token.template.js";\nimport { buildCollectionSheetHtml } from "./print/collection-sheet.template.js";\nimport { buildCertificateHtml } from "./print/certificate.template.js";\n'''
          if '"./print/token.template.js"' not in s:
              anchor='import { closeDB, getDB } from "./db/connection.js";\n'
              s=s.replace(anchor, anchor+imports)
          pattern=r'// ===== Token sheet HTML builder.*?(?=// ===== IPC)'
          s2=re.sub(pattern,'// ===== Print templates are maintained in electron/print/*.template.ts =====\n\n',s,flags=re.S)
          if s2==s:
              raise SystemExit('Could not locate inline print builder block; refusing to modify main.ts')
          p.write_text(s2,encoding='utf-8')
      - name: Commit integration
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add electron/main.ts
          git diff --cached --quiet || git commit -m "refactor: use dedicated print templates"
          git push origin print-template-enhancement
