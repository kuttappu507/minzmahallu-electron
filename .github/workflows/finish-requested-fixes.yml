name: Finish requested fixes
on:
  push:
    branches: [fix/requested-mms-ui-token]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        shell: python
        run: |
          from pathlib import Path
          import re
          def R(p): return Path(p).read_text()
          def W(p,s): Path(p).write_text(s)
          p='electron/main.ts'; s=R(p); s=s.replace('import { login, changePassword } from "./services/auth.service.js";','import { login, changePassword, needsInitialSetup, createInitialAdministrator } from "./services/auth.service.js";'); a='ipcMain.handle("auth:currentUser", () => session.user);'; b=a+'\n  ipcMain.handle("auth:setupStatus", () => ({ required: needsInitialSetup() }));\n  ipcMain.handle("auth:createInitialAdministrator", (_e, username: string, fullName: string, password: string) => { try { const user = createInitialAdministrator(username, fullName, password); session.user = { id:user.id, username:user.username, fullName:user.fullName, role:user.role }; return { success:true, user }; } catch (err:any) { return { success:false, error:err.message }; } });'; s=s if 'auth:setupStatus' in s else s.replace(a,b); W(p,s)
          p='src/pages/Settings.tsx'; s=R(p); s=s.replace('interface Settings { mahallu_name: string; phone: string; email: string; address: string; financial_year_start: string; currency_symbol: string; receipt_prefix: string; language: string; auto_backup: boolean; backup_interval_hours: number; }','interface Settings { mahallu_name:string; phone:string; email:string; address:string; financial_year_start:string; currency_symbol:string; receipt_prefix:string; language:string; theme:string; auto_backup:boolean; backup_interval_hours:number; }'); s=s.replace('language: "en", auto_backup:','language: "en", theme: "light", auto_backup:'); s=s.replace('setSettings({ ...emptySettings, ...s, language: lang });','setSettings({ ...emptySettings, ...s, language: s.language || lang, theme: s.theme || theme });'); s=s.replace('await window.mms.settings.save(settings);','await window.mms.settings.save({ mahalluName:settings.mahallu_name,address:settings.address,phone:settings.phone,email:settings.email,financialYearStart:settings.financial_year_start,currencySymbol:settings.currency_symbol,theme:settings.theme,language:settings.language,autoBackup:settings.auto_backup,backupIntervalHours:settings.backup_interval_hours,receiptPrefix:settings.receipt_prefix });'); s=s.replace('setSettings({ ...settings, language: settings.language });','setSettings({ ...settings, theme: value });'); s=s.replace('<Select value={theme} onChange={(e) => handleThemeChange(e.target.value)}>','<Select value={settings.theme} onChange={(e) => handleThemeChange(e.target.value)}>'); W(p,s)
          p='src/pages/LoginPage.tsx'; s=R(p).replace('<div className="login-logo-box"><b>M</b></div>','<div className="login-logo-box"><img src="/logo.svg" alt="MMS" /></div>').replace('<div className="login-logo-box-sm"><b>M</b></div>','<div className="login-logo-box-sm"><img src="/logo.svg" alt="MMS" /></div>'); W(p,s)
          p='src/styles/topbar-fixes.css'; s=R(p)+'''\n.langseg{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:3px;gap:2px;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-sizing:border-box}.langseg button{height:26px;min-width:36px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:transparent;color:var(--mut);font:700 11px/1 Poppins,"Noto Sans Malayalam",sans-serif;white-space:nowrap}.langseg button:last-child{min-width:44px}.langseg button.on{background:var(--em);color:#fff}\n'''; W(p,s)
          p='src/styles/visual-enhancement.css'; s=R(p)+'''\n.sb-logo .logo{display:flex;align-items:center;justify-content:center;overflow:hidden}.sb-logo .logo img{width:30px;height:30px;display:block}.login-logo-box img,.login-logo-box-sm img{width:100%;height:100%;display:block;object-fit:contain}\n'''; W(p,s)
          p='src/pages/Tokens.tsx'; s=R(p); s=s.replace('if (result?.length && !selectedEventId) setSelectedEventId(result[0].id);','const requestedEventId=Number(new URLSearchParams(window.location.search).get("event")||0); const requested=result?.find((e:any)=>e.id===requestedEventId); if(requested)setSelectedEventId(requested.id); else if(result?.length&&!selectedEventId)setSelectedEventId(result[0].id);'); W(p,s)
          for p in ['electron/print/token.template.ts','src/lib/tokenPrint.ts']:
            s=R(p); s=re.sub(r'function paletteForEvent\(event: any\) \{.*?\n\}\n','function paletteForTokenIndex(index:number){return palettes[Math.abs(index)%palettes.length];}\n',s,flags=re.S); s=s.replace('const p = paletteForEvent(event);','const p = paletteForTokenIndex(0);').replace('const base = paletteForEvent(event);','const base = paletteForTokenIndex(0);'); s=s.replace('const makeCard = (t: any) => `','const makeCard = (t:any,cardIndex:number)=>{const p=paletteForTokenIndex(cardIndex);return `').replace('    </article>`;','    </article>`;};',1); s=s.replace('.map(makeCard).join("")','.map((t,idx)=>makeCard(t,i+idx)).join("")').replace('.map(makeCard).join(\'\')','.map((t,idx)=>makeCard(t,i+idx)).join(\'\')'); W(p,s)
          Path('.github/workflows/finish-requested-fixes.yml').unlink()
      - name: Build
        run: npm install && npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || (git commit -m "fix requested UI token setup" && git push)
