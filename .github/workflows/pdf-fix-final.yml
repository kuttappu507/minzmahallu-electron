name: Robust PDF Rendering Fix

on:
  push:
    branches: [main]

jobs:
  fix-pdf:
    if: contains(github.event.head_commit.message, '[pdf-final-fix]') == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch PDF renderer
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('electron/main.ts')
          s = p.read_text(encoding='utf-8')

          marker = '// ===== Robust HTML-to-PDF renderer ====='
          if marker not in s:
              helper = r'''

          // ===== Robust HTML-to-PDF renderer =====
          async function renderHtmlToPdf(html: string): Promise<Buffer> {
            const pdfWin = new BrowserWindow({
              show: false,
              width: 794,
              height: 1123,
              useContentSize: true,
              backgroundColor: '#ffffff',
              webPreferences: {
                offscreen: false,
                sandbox: false,
              },
            });

            try {
              const dataUrl = 'data:text/html;charset=UTF-8,' + encodeURIComponent(html);
              await pdfWin.loadURL(dataUrl);

              // Force a real layout before asking Chromium's print subsystem to calculate
              // the printable content rectangle. This avoids Chromium's
              // "content area is empty" validation failure.
              await pdfWin.webContents.executeJavaScript(`
                document.documentElement.style.width = '210mm';
                document.body.style.width = '210mm';
                void document.body.offsetHeight;
                ({
                  bodyWidth: document.body.scrollWidth,
                  bodyHeight: document.body.scrollHeight,
                  htmlWidth: document.documentElement.scrollWidth,
                  htmlHeight: document.documentElement.scrollHeight
                });
              `);

              await new Promise(resolve => setTimeout(resolve, 150));

              return await pdfWin.webContents.printToPDF({
                pageSize: 'A4',
                printBackground: true,
                margins: { top: 0, bottom: 0, left: 0, right: 0 },
                preferCSSPageSize: false,
              });
            } finally {
              if (!pdfWin.isDestroyed()) pdfWin.destroy();
            }
          }
'''
              s = s.replace('// ===== Token sheet HTML builder', helper + '\n// ===== Token sheet HTML builder', 1)

          # Replace the generic PDF block's renderer portion.
          old_generic = '''      // Create a hidden BrowserWindow to render the HTML
      const pdfWin = new BrowserWindow({
        show: false,
        webPreferences: { offscreen: true },
      });
      const base64Html = Buffer.from(html).toString("base64"); await pdfWin.loadURL("data:text/html;base64," + base64Html);
      // Wait for content to render
      await new Promise(r => setTimeout(r, 500));
      const pdfBuffer = await pdfWin.webContents.printToPDF({
        pageSize: "A4",
        printBackground: true,
        margins: { top: 0.05, bottom: 0.05, left: 0.05, right: 0.05 },
        preferCSSPageSize: true,
      });
      pdfWin.close();'''
          new_generic = '''      const pdfBuffer = await renderHtmlToPdf(html);'''
          if old_generic not in s:
              raise SystemExit('generic PDF block not found')
          s = s.replace(old_generic, new_generic, 1)

          # Certificate renderer.
          old_cert = '''      const pdfWin = new BrowserWindow({ show: false, webPreferences: { } });
      // Use loadURL with base64 encoding for large HTML
      const base64Html = Buffer.from(html).toString("base64");
      await pdfWin.loadURL("data:text/html;base64," + base64Html);
      await new Promise(r => setTimeout(r, 1000));
      const pdfBuffer = await pdfWin.webContents.printToPDF({
        pageSize: "A4", printBackground: true,
        margins: { top: 0.05, bottom: 0.05, left: 0.05, right: 0.05 },
        preferCSSPageSize: true,
      });
      pdfWin.close();'''
          new_cert = '''      const pdfBuffer = await renderHtmlToPdf(html);'''
          if old_cert not in s:
              raise SystemExit('certificate PDF block not found')
          s = s.replace(old_cert, new_cert, 1)

          # Token and collection renderers: replace both identical patterns.
          old_tokens = '''      const pdfWin = new BrowserWindow({ show: false, webPreferences: { offscreen: true } });
      const base64Html = Buffer.from(html).toString("base64"); await pdfWin.loadURL("data:text/html;base64," + base64Html);
      await new Promise(r => setTimeout(r, 500));
      const pdfBuffer = await pdfWin.webContents.printToPDF({
        pageSize: "A4", printBackground: true,
        margins: { top: 0.05, bottom: 0.05, left: 0.05, right: 0.05 },
        preferCSSPageSize: true,
      });
      pdfWin.close();'''
          new_tokens = '''      const pdfBuffer = await renderHtmlToPdf(html);'''
          count = s.count(old_tokens)
          if count != 2:
              raise SystemExit(f'expected 2 token PDF blocks, found {count}')
          s = s.replace(old_tokens, new_tokens, 2)

          p.write_text(s, encoding='utf-8')
          print('PDF renderer patched successfully')

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/main.ts
          git rm .github/workflows/pdf-fix-final.yml
          git commit -m "Fix PDF content-area rendering [pdf-final-fix]"
          git push
