name: Fix certificate syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip cert-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix template
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('electron/print/certificate.template.ts')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const signatureText = .*?;\n  const committeeText = .*?;", "const signatureText = ml ? 'അധികൃത ഒപ്പുവെപ്പുകാരൻ' : 'Authorized Signatory';\n  const committeeText = ml ? 'മഹല്ല് കമ്മിറ്റി' : 'Mahallu Committee';", s)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/fix-certificate-syntax.yml').unlink()
      - name: Verify
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || (git commit -m "fix: repair certificate template syntax [skip cert-fix]" && git push)
