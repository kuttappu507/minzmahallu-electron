name: Run Visual Enhancement
on:
  push:
    branches: [visual-enhancement-work]
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply safe visual changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          # Remove Gayathri font files and textual references.
          for p in list(Path('.').rglob('*')):
              if p.is_file() and '.git' not in p.parts and ('Gayathri' in p.name or 'gayathri' in p.name):
                  p.unlink()
          for p in [Path('src/styles/globals.css'),Path('src/styles/overrides.css'),Path('src/main.tsx')]:
              if p.exists():
                  s=p.read_text(encoding='utf-8')
                  s=re.sub(r'(?i)Gayathri','Anek Malayalam Variable',s)
                  p.write_text(s,encoding='utf-8')
          ov=Path('src/styles/overrides.css')
          s=ov.read_text(encoding='utf-8') if ov.exists() else ''
          if '/* ===== FINAL VISUAL SYSTEM ===== */' not in s:
              s += '''\n\n/* ===== FINAL VISUAL SYSTEM ===== */\n:root{--ui-radius:12px;--ui-radius-sm:9px}\n.data-table table{width:100%;border-collapse:separate;border-spacing:0}.data-table th,.data-table td{vertical-align:middle;text-align:left}.data-table th{font-size:12.5px!important;font-weight:650!important;line-height:1.35;white-space:nowrap;padding:13px 16px!important}.data-table td{font-size:14px!important;line-height:1.45;padding:14px 16px!important}.data-table th:first-child,.data-table td:first-child{padding-left:18px!important}.data-table th:last-child,.data-table td:last-child{padding-right:18px!important}.data-table tbody tr{min-height:48px}.stat-grid .sval,.stat-grid .stat-value,.stat-grid .val{font-size:34px!important;line-height:1.05;font-weight:700!important;letter-spacing:-.02em}.stat-grid .slab,.stat-grid .stat-label,.stat-grid .label{font-size:12px!important;line-height:1.4;font-weight:600!important}.stat-grid .sdelta,.stat-grid .stat-delta,.stat-grid .delta{font-size:11.5px!important}input:not([type="checkbox"]):not([type="radio"]),textarea,select{font-size:15px!important;line-height:1.45}label,.label,.field-label{font-size:12.5px!important;font-weight:600!important}button{font-size:13.5px}html.lang-ml *,html.lang-ml body,html.lang-ml input,html.lang-ml button,html.lang-ml select,html.lang-ml textarea{font-family:"Anek Malayalam Variable",Poppins,sans-serif!important}html.lang-ml .data-table th,html.lang-ml thead th{font-size:13px!important;font-weight:650!important;line-height:1.4}html.lang-ml .data-table td{font-size:14.5px!important;line-height:1.55}html.lang-ml input,html.lang-ml textarea,html.lang-ml select{font-size:15.5px!important;line-height:1.55}\n'''
              ov.write_text(s,encoding='utf-8')
          # Do not replace the working PDF/DB code in this pass. Keep print logic stable.
          PY
      - name: Remove helper workflows and commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          rm -f .github/workflows/visual-enhancement.yml .github/workflows/apply-visual-enhancement.yml .github/workflows/run-visual-enhancement.yml BACKUP_BEFORE_VISUAL_ENHANCEMENT.md
          git add -A
          git commit -m "feat: remove Gayathri and refine application visuals" || exit 0
          git push
