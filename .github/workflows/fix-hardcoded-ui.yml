name: Fix Hardcoded UI Localization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip i18n-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply localization fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in replacements:
                  if old in s:
                      s = s.replace(old, new)
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  print(f'updated {path}')

          # Add reusable translations without touching existing keys.
          p = Path('src/i18n/index.ts')
          s = p.read_text(encoding='utf-8')
          marker = '  // Generic UI\n'
          block = '''  ui_clear: { en: "Clear", ml: "മായ്ക്കുക" },\n  gender_male: { en: "Male", ml: "പുരുഷൻ" },\n  gender_female: { en: "Female", ml: "സ്ത്രീ" },\n  gender_other: { en: "Other", ml: "മറ്റുള്ളവ" },\n  blood_a_plus: { en: "A+", ml: "A+" },\n  blood_a_minus: { en: "A-", ml: "A-" },\n  blood_b_plus: { en: "B+", ml: "B+" },\n  blood_b_minus: { en: "B-", ml: "B-" },\n  blood_ab_plus: { en: "AB+", ml: "AB+" },\n  blood_ab_minus: { en: "AB-", ml: "AB-" },\n  blood_o_plus: { en: "O+", ml: "O+" },\n  blood_o_minus: { en: "O-", ml: "O-" },\n  marital_single: { en: "Single", ml: "അവിവാഹിതൻ" },\n  marital_married: { en: "Married", ml: "വിവാഹിതൻ" },\n  marital_divorced: { en: "Divorced", ml: "വിവാഹമോചിതൻ" },\n  marital_widowed: { en: "Widowed", ml: "വിധവ / വിധുരൻ" },\n  relation_head: { en: "Head", ml: "കുടുംബനാഥൻ" },\n  relation_spouse: { en: "Spouse", ml: "ഭാര്യ / ഭർത്താവ്" },\n  relation_son: { en: "Son", ml: "മകൻ" },\n  relation_daughter: { en: "Daughter", ml: "മകൾ" },\n  relation_parent: { en: "Parent", ml: "മാതാപിതാവ്" },\n  relation_sibling: { en: "Sibling", ml: "സഹോദരൻ / സഹോദരി" },\n  filter_all: { en: "All", ml: "എല്ലാം" },\n  status_paid: { en: "Paid", ml: "അടച്ചത്" },\n  status_pending: { en: "Pending", ml: "ബാക്കി" },\n  status_overdue: { en: "Overdue", ml: "കാലാവധി കഴിഞ്ഞത്" },\n  status_partial: { en: "Partial", ml: "ഭാഗികം" },\n  status_approved: { en: "Approved", ml: "അംഗീകരിച്ചു" },\n  status_rejected: { en: "Rejected", ml: "നിരസിച്ചു" },\n  status_disbursed: { en: "Disbursed", ml: "വിതരണം ചെയ്തു" },\n  payment_cash: { en: "Cash", ml: "പണം" },\n  payment_cheque: { en: "Cheque", ml: "ചെക്ക്" },\n  payment_bank_transfer: { en: "Bank Transfer", ml: "ബാങ്ക് ട്രാൻസ്ഫർ" },\n  payment_card: { en: "Card", ml: "കാർഡ്" },\n  payment_other: { en: "Other", ml: "മറ്റുള്ളവ" },\n  acc_income_delta: { en: "income", ml: "വരുമാനം" },\n  acc_expense_delta: { en: "expense", ml: "ചെലവ്" },\n  acc_balance_delta: { en: "balance", ml: "ബാലൻസ്" },\n  sub_collected: { en: "collected", ml: "പിരിഞ്ഞത്" },\n  sub_dues: { en: "dues", ml: "ബാക്കി" },\n  sub_total_collected: { en: "Total Collected", ml: "മൊത്തം പിരിഞ്ഞത്" },\n  sub_pending_dues: { en: "Pending Dues", ml: "ബാക്കി തുക" },\n  wel_requested: { en: "requested", ml: "അഭ്യർത്ഥിച്ചത്" },\n  wel_approved: { en: "approved", ml: "അംഗീകരിച്ചത്" },\n  wel_total_requested: { en: "Total Requested", ml: "മൊത്തം അഭ്യർത്ഥിച്ചത്" },\n  wel_total_approved: { en: "Total Approved", ml: "മൊത്തം അംഗീകരിച്ചത്" },\n  mrg_bride_details: { en: "Bride Details", ml: "വധുവിന്റെ വിവരങ്ങൾ" },\n  mrg_groom_details: { en: "Groom Details", ml: "വരന്റെ വിവരങ്ങൾ" },\n  mrg_witnesses: { en: "Witnesses", ml: "സാക്ഷികൾ" },\n  mrg_other_details: { en: "Other Details", ml: "മറ്റ് വിവരങ്ങൾ" },\n  rpt_export_csv: { en: "Export as CSV", ml: "CSV ആയി കയറ്റുമതി ചെയ്യുക" },\n  rpt_export_excel: { en: "Export as Excel", ml: "Excel ആയി കയറ്റുമതി ചെയ്യുക" },\n  rpt_save_pdf: { en: "Save as PDF", ml: "PDF ആയി സേവ് ചെയ്യുക" },\n\n'''
          if 'ui_clear:' not in s and marker in s:
              s = s.replace(marker, marker + block, 1)
              p.write_text(s, encoding='utf-8')

          replace('src/components/layout/GlobalSearch.tsx', [
              ('aria-label="Clear"', 'aria-label={t("ui_clear")}'),
          ])
          replace('src/components/layout/Topbar.tsx', [
              ('title="English"', 'title={t("set_lang_english")}'),
          ])
          replace('src/pages/Certificates.tsx', [
              ('title="Clear"', 'title={t("ui_clear")}'),
          ])

          replace('src/pages/Accounting.tsx', [
              ('<span className="delta">income</span>', '<span className="delta">{t("acc_income_delta")}</span>'),
              ('<span className="delta">expense</span>', '<span className="delta">{t("acc_expense_delta")}</span>'),
              ('<span className="delta">balance</span>', '<span className="delta">{t("acc_balance_delta")}</span>'),
              ('<option>All</option>\n            <option>Income</option>\n            <option>Expense</option>', '<option value="All">{t("filter_all")}</option>\n            <option value="Income">{t("acc_income")}</option>\n            <option value="Expense">{t("acc_expense")}</option>'),
              ('<option>Income</option>\n                <option>Expense</option>', '<option value="Income">{t("acc_income")}</option>\n                <option value="Expense">{t("acc_expense")}</option>'),
              ('<option>Cash</option>\n                <option>Cheque</option>\n                <option>UPI</option>\n                <option>Bank Transfer</option>\n                <option>Card</option>\n                <option>Other</option>', '<option value="Cash">{t("payment_cash")}</option>\n                <option value="Cheque">{t("payment_cheque")}</option>\n                <option value="UPI">UPI</option>\n                <option value="Bank Transfer">{t("payment_bank_transfer")}</option>\n                <option value="Card">{t("payment_card")}</option>\n                <option value="Other">{t("payment_other")}</option>'),
              ('{r.type}</Badge>', '{t(r.type === "Income" ? "acc_income" : "acc_expense")}</Badge>'),
              ('{previewRow.type} · {formatDate(previewRow.txn_date)} · {formatCurrency(previewRow.amount)}', '{t(previewRow.type === "Income" ? "acc_income" : "acc_expense")} · {formatDate(previewRow.txn_date)} · {formatCurrency(previewRow.amount)}'),
              ('>{previewRow.type}</Badge>', '>{t(previewRow.type === "Income" ? "acc_income" : "acc_expense")}</Badge>'),
          ])

          replace('src/pages/Donations.tsx', [
              ('<option>Cash</option>\n                <option>Cheque</option>\n                <option>UPI</option>\n                <option>Bank Transfer</option>\n                <option>Card</option>\n                <option>Other</option>', '<option value="Cash">{t("payment_cash")}</option>\n                <option value="Cheque">{t("payment_cheque")}</option>\n                <option value="UPI">UPI</option>\n                <option value="Bank Transfer">{t("payment_bank_transfer")}</option>\n                <option value="Card">{t("payment_card")}</option>\n                <option value="Other">{t("payment_other")}</option>'),
          ])

          replace('src/pages/Deaths.tsx', [
              ('<option>Male</option>\n                <option>Female</option>\n                <option>Other</option>', '<option value="Male">{t("gender_male")}</option>\n                <option value="Female">{t("gender_female")}</option>\n                <option value="Other">{t("gender_other")}</option>'),
          ])

          replace('src/pages/Marriages.tsx', [
              ('<SectionLabel>Bride Details</SectionLabel>', '<SectionLabel>{t("mrg_bride_details")}</SectionLabel>'),
              ('<SectionLabel>Groom Details</SectionLabel>', '<SectionLabel>{t("mrg_groom_details")}</SectionLabel>'),
              ('<SectionLabel>Witnesses</SectionLabel>', '<SectionLabel>{t("mrg_witnesses")}</SectionLabel>'),
              ('<SectionLabel>Other Details</SectionLabel>', '<SectionLabel>{t("mrg_other_details")}</SectionLabel>'),
          ])

          replace('src/pages/Subscriptions.tsx', [
              ('<span className="delta">collected</span>', '<span className="delta">{t("sub_collected")}</span>'),
              ('<div className="slab">Total Collected</div>', '<div className="slab">{t("sub_total_collected")}</div>'),
              ('<span className="delta">dues</span>', '<span className="delta">{t("sub_dues")}</span>'),
              ('<div className="slab">Pending Dues</div>', '<div className="slab">{t("sub_pending_dues")}</div>'),
              ('<option>All</option>\n            <option>Paid</option>\n            <option>Pending</option>\n            <option>Overdue</option>\n            <option>Partial</option>', '<option value="All">{t("filter_all")}</option>\n            <option value="Paid">{t("status_paid")}</option>\n            <option value="Pending">{t("status_pending")}</option>\n            <option value="Overdue">{t("status_overdue")}</option>\n            <option value="Partial">{t("status_partial")}</option>'),
              ('<option>Cash</option>\n                <option>Cheque</option>\n                <option>UPI</option>\n                <option>Bank Transfer</option>\n                <option>Card</option>\n                <option>Other</option>', '<option value="Cash">{t("payment_cash")}</option>\n                <option value="Cheque">{t("payment_cheque")}</option>\n                <option value="UPI">UPI</option>\n                <option value="Bank Transfer">{t("payment_bank_transfer")}</option>\n                <option value="Card">{t("payment_card")}</option>\n                <option value="Other">{t("payment_other")}</option>'),
              ('<option>Paid</option>\n                <option>Pending</option>\n                <option>Overdue</option>\n                <option>Partial</option>', '<option value="Paid">{t("status_paid")}</option>\n                <option value="Pending">{t("status_pending")}</option>\n                <option value="Overdue">{t("status_overdue")}</option>\n                <option value="Partial">{t("status_partial")}</option>'),
          ])

          replace('src/pages/Welfare.tsx', [
              ('<span className="delta">requested</span>', '<span className="delta">{t("wel_requested")}</span>'),
              ('<div className="slab">Total Requested</div>', '<div className="slab">{t("wel_total_requested")}</div>'),
              ('<span className="delta">approved</span>', '<span className="delta">{t("wel_approved")}</span>'),
              ('<div className="slab">Total Approved</div>', '<div className="slab">{t("wel_total_approved")}</div>'),
              ('<option>All</option>\n            <option>Pending</option>\n            <option>Approved</option>\n            <option>Rejected</option>\n            <option>Disbursed</option>', '<option value="All">{t("filter_all")}</option>\n            <option value="Pending">{t("status_pending")}</option>\n            <option value="Approved">{t("status_approved")}</option>\n            <option value="Rejected">{t("status_rejected")}</option>\n            <option value="Disbursed">{t("status_disbursed")}</option>'),
              ('<option>Pending</option>\n                <option>Approved</option>\n                <option>Rejected</option>\n                <option>Disbursed</option>', '<option value="Pending">{t("status_pending")}</option>\n                <option value="Approved">{t("status_approved")}</option>\n                <option value="Rejected">{t("status_rejected")}</option>\n                <option value="Disbursed">{t("status_disbursed")}</option>'),
          ])

          replace('src/pages/AuditLog.tsx', [
              ('<option>All</option>', '<option value="All">{t("filter_all")}</option>'),
          ])

          replace('src/pages/Reports.tsx', [
              ('title="Export as CSV"', 'title={t("rpt_export_csv")}'),
              ('title="Export as Excel"', 'title={t("rpt_export_excel")}'),
              ('title="Save as PDF"', 'title={t("rpt_save_pdf")}'),
          ])

          # Members: preserve database enum values while translating the displayed labels.
          replace('src/pages/Members.tsx', [
              ('<option>Male</option><option>Female</option><option>Other</option>', '<option value="Male">{t("gender_male")}</option><option value="Female">{t("gender_female")}</option><option value="Other">{t("gender_other")}</option>'),
              ('<option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>', '<option value="A+">{t("blood_a_plus")}</option><option value="A-">{t("blood_a_minus")}</option><option value="B+">{t("blood_b_plus")}</option><option value="B-">{t("blood_b_minus")}</option><option value="AB+">{t("blood_ab_plus")}</option><option value="AB-">{t("blood_ab_minus")}</option><option value="O+">{t("blood_o_plus")}</option><option value="O-">{t("blood_o_minus")}</option>'),
              ('<option>Single</option><option>Married</option><option>Divorced</option><option>Widowed</option>', '<option value="Single">{t("marital_single")}</option><option value="Married">{t("marital_married")}</option><option value="Divorced">{t("marital_divorced")}</option><option value="Widowed">{t("marital_widowed")}</option>'),
              ('<option>Head</option><option>Spouse</option><option>Son</option><option>Daughter</option><option>Parent</option><option>Sibling</option><option>Other</option>', '<option value="Head">{t("relation_head")}</option><option value="Spouse">{t("relation_spouse")}</option><option value="Son">{t("relation_son")}</option><option value="Daughter">{t("relation_daughter")}</option><option value="Parent">{t("relation_parent")}</option><option value="Sibling">{t("relation_sibling")}</option><option value="Other">{t("gender_other")}</option>'),
          ])
          PY

      - name: Commit localization fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No localization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: localize remaining user-facing English [skip i18n-fix]"
          git push origin main

      - name: Trigger full build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Build Electron App" --ref main || true
